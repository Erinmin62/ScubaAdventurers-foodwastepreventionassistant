openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
# Guard endpoints require a verified Clerk session and return 401 when signed
# out. Workspace identity comes only from that session, never request input.
# Notification review tokens additionally require the owning session.
security:
  - ownerSession: []
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /guard/email-preview:
    get:
      operationId: getEmailPreview
      summary: Read-only expiry email preview for the signed-in owner's workspace
      responses:
        "200":
          description: Current urgent expiry alerts and 2–3 day digest preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreview"
        "401": { description: Sign-in required }
        "503": { description: Email preview unavailable }
  /guard/email-history:
    get:
      operationId: getEmailHistory
      summary: Latest 50 notification email attempts for the signed-in owner
      responses:
        "200":
          description: Acceptance audit and separately verified delivery evidence
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/EmailHistoryRecord" }
        "401": { description: Sign-in required }
        "503": { description: Email history unavailable }
  /webhooks/resend:
    post:
      security: []
      operationId: receiveEmailDelivery
      summary: Opt-in Resend webhook verified using Svix headers and raw body
      parameters:
        - in: header
          name: svix-id
          required: true
          schema: { type: string, maxLength: 200 }
        - in: header
          name: svix-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: svix-signature
          required: true
          schema: { type: string }
      responses:
        "200": { description: Verified receipt persisted or unsupported event ignored }
        "400": { description: Invalid signature or event }
        "503": { description: Disabled or receipt storage unavailable }
  /storage/uploads/request-url:
    post:
      operationId: requestIngredientPhotoUpload
      summary: Request an owner-scoped ingredient photo upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientPhotoUploadRequest" }
      responses:
        "200":
          description: A short-lived upload URL and private object reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngredientPhotoUploadResponse" }
        "400": { description: Invalid photo metadata or ingredient }
        "401": { description: Sign-in required }
  /storage/uploads/confirm:
    post:
      operationId: confirmIngredientPhotoUpload
      summary: Confirm and save an uploaded ingredient photo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientPhotoConfirmRequest" }
      responses:
        "200":
          description: Owner workspace with the confirmed photo reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "400": { description: "Invalid, missing, or oversized photo" }
        "401": { description: Sign-in required }
  /storage/ingredients/{ingredientId}/photo:
    delete:
      operationId: removeIngredientPhoto
      summary: Remove the custom photo from an owner ingredient
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200":
          description: Owner workspace with the bundled ingredient image restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "401": { description: Sign-in required }
        "404": { description: Ingredient not found in this owner's workspace }
  /storage/objects/{objectKey}:
    get:
      operationId: getIngredientPhoto
      summary: Serve an ingredient photo to its owning food-business account
      parameters:
        - name: objectKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{96}$" }
      responses:
        "302": { description: Temporary redirect to a short-lived private object URL }
        "401": { description: Sign-in required }
        "404": { description: Photo not found for this owner }
  /guard/inbox:
    get:
      operationId: getInbox
      responses:
        "200":
          description: Persistent in-app notifications and attention counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxState" }
  /guard/inbox/update:
    post:
      operationId: updateInbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxUpdateInput" }
      responses:
        "200":
          description: Read or dismissal state saved; no action executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxState" }
        "400": { description: Invalid operation }
        "404": { description: Notification not found }
  /guard/inbox/thresholds:
    patch:
      operationId: updateInboxThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxThresholds" }
      responses:
        "200":
          description: Thresholds updated and expiry notifications reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxState" }
        "400": { description: Invalid thresholds }
  /guard/ingredients/{id}/batches:
    post:
      operationId: saveIngredientBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockBatchInput" }
      responses:
        "200":
          description: Received stock saved, planned delivery unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/notifications:
    get:
      operationId: getNotifications
      responses:
        "200":
          description: Notification preferences and demo delivery history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
    patch:
      operationId: saveNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /guard/monitor-status:
    get:
      operationId: getMonitorHeartbeatStatus
      responses:
        "200":
          description: Read-only status of the latest owner workspace monitor check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorHeartbeatStatus" }
  /guard/expiry-check-status:
    get:
      operationId: getExpiryCheckStatus
      responses:
        "200":
          description: Read-only status of the latest scheduled expiry scan for the authenticated owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpiryCheckStatus" }
        "503": { description: Expiry check status is temporarily unavailable }
  /guard/notifications/scan:
    post:
      operationId: scanNotifications
      responses:
        "200":
          description: Scan completed without approving any action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /guard/notifications/tick:
    post:
      security:
        - schedulerSecret: []
      operationId: runNotificationTick
      responses:
        "204": { description: Authorized server-side planning and notification scan completed; demo previews only }
        "403": { description: Invalid scheduler credential }
        "503": { description: Scheduler credential not configured }
  /guard/notifications/review:
    post:
      operationId: reviewNotification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReviewInput" }
      responses:
        "200":
          description: Read-only review, token never approves actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationReview" }
        "410":
          description: Link expired, resolved or invalid
  /guard/notifications/webhook:
    get:
      security: []
      operationId: verifyWhatsAppWebhook
      responses:
        "200": { description: Meta verification challenge }
        "403": { description: Verification rejected }
    post:
      operationId: receiveWhatsAppWebhook
      security: []
      responses:
        "200": { description: Verified provider status processed }
        "403": { description: Signature verification rejected }
  /guard/reorders:
    get:
      operationId: getReorders
      responses:
        "200":
          description: Live analysis and saved simulated order proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/scan:
    post:
      operationId: scanReorders
      responses:
        "200":
          description: Proposals generated without execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/settings:
    patch:
      operationId: configureReorder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderConfig" }
      responses:
        "200":
          description: Assumptions saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/{id}/preview:
    post:
      operationId: previewReorder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderPreviewInput" }
      responses:
        "200":
          description: Read-only comparison; no stock, delivery, decision or activity records changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderPreview" }
        "400": { description: "Invalid scenario, incomplete demand, stale or decided proposal" }
  /guard/reorders/{id}/decision:
    post:
      operationId: decideReorder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDecisionInput"
      responses:
        "200":
          description: Decision and execution result, including failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/automation:
    patch:
      operationId: updateAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationSettingsInput" }
      responses:
        "200":
          description: Automation settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/automation/run:
    post:
      operationId: runAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRunInput" }
      responses:
        "200":
          description: Enabled workflows run now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/state:
    get:
      operationId: getGuardState
      responses:
        "200":
          description: Complete food-business workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/business-profile:
    patch:
      operationId: updateBusinessProfile
      summary: Update the authenticated owner's food-business name and type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProfileInput" }
      responses:
        "200":
          description: Updated owner workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "400": { description: Invalid business profile }
  /guard/workspace/setup:
    post:
      operationId: chooseWorkspaceMode
      summary: Keep the synthetic demo or replace it with an owner-data workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceSetupInput" }
      responses:
        "200":
          description: Updated owner workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "400": { description: Invalid or unconfirmed workspace choice }
  /guard/history:
    get:
      operationId: getHistoricalRecords
      summary: List historical records kept separate from live planning inputs
      responses:
        "200":
          description: Historical records for the authenticated owner workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalRecordsResponse" }
  /guard/history/batches/{batchId}:
    delete:
      operationId: removeHistoricalBatch
      summary: Remove only this owner's archive batch without changing operational records
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoricalBatchRemoval" }
      responses:
        "200":
          description: Remaining archive after removal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalRecordsResponse" }
        "400":
          description: Explicit confirmation required
        "404":
          description: Batch not found in this owner's archive
  /guard/history/import:
    post:
      operationId: importHistoricalRecords
      summary: Append validated historical records without changing live stock, sales, or orders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistoricalRecordsInput" }
      responses:
        "200":
          description: Historical records appended to the authenticated owner workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalRecordsResponse" }
        "400": { description: One or more records failed validation; no records were imported }
  /guard/records:
    post:
      operationId: addGuardRecords
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordsInput" }
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/menu:
    post:
      operationId: createMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItemInput" }
      responses:
        "201":
          description: Menu item created in the owner workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "400": { description: "Invalid name, recipe or price details" }
  /guard/menu/{id}:
    patch:
      operationId: updateMenuItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItemUpdate" }
      responses:
        "200":
          description: Menu item updated; historical sales and waste snapshots are preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "400": { description: Invalid menu update }
        "404": { description: Menu item not found }
    delete:
      operationId: deleteMenuItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Unused item removed or item with historical records archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
        "404": { description: Menu item not found }
  /guard/menu/recipe-draft:
    post:
      operationId: draftMenuRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuRecipeDraftInput" }
      responses:
        "200":
          description: AI-suggested recipe using only ingredients in this owner's inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuRecipeDraft" }
        "400": { description: Invalid dish details or no inventory ingredients }
        "429": { description: Recipe drafting request limit reached }
        "503": { description: Recipe drafting is temporarily unavailable }
  /guard/ai-forecast/demo:
    post:
      operationId: generateAiDemoForecast
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiForecastDemoInput" }
      responses:
        "200":
          description: Experimental LLM forecast generated only from synthetic demo data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiForecastDemoResponse" }
        "400": { description: Demo-only acknowledgement is required }
        "429": { description: AI forecast demo request limit reached }
        "503": { description: AI forecast demo is temporarily unavailable }
  /guard/recommendations/{id}/decision:
    post:
      operationId: decideRecommendation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/recommendations/{id}/follow-up:
    post:
      operationId: attachFollowUp
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowUpScheduleInput" }
      responses:
        "200":
          description: Follow-up attached using a current snapshot, not a historical baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/follow-ups/{id}/outcome:
    post:
      operationId: recordFollowUpOutcome
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "200":
          description: Outcome recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk-verified browser session; all business data is scoped to its owner.
    schedulerSecret:
      type: http
      scheme: bearer
      description: Separate server-configured scheduler credential; a user session cannot run global checks.
  schemas:
    EmailPreview:
      type: object
      required: [workspaceName, synthetic, generatedAt, timeZone, urgentAlerts, digest]
      properties:
        workspaceName: { type: string }
        synthetic: { type: boolean }
        generatedAt: { type: string, format: date-time }
        timeZone: { type: string }
        urgentAlerts:
          type: array
          items: { $ref: "#/components/schemas/ExpiryEmailPreviewItem" }
        digest:
          type: array
          items: { $ref: "#/components/schemas/ExpiryEmailPreviewItem" }
    ExpiryEmailPreviewItem:
      type: object
      required: [kind, subject, text, itemCount]
      properties:
        kind: { type: string, enum: [critical_expiry, daily_digest] }
        subject: { type: string }
        text: { type: string }
        itemCount: { type: integer, minimum: 1 }
    EmailHistoryRecord:
      type: object
      required: [id, kind, subject, attemptStatus, observedAt, attemptedAt, acceptedAt, deliveryStatus, deliveryUpdatedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        subject: { type: string }
        attemptStatus:
          type: string
          enum: [queued, sending, accepted, failed, uncertain, cancelled]
        observedAt: { type: string, format: date-time }
        attemptedAt: { type: [string, "null"], format: date-time }
        acceptedAt: { type: [string, "null"], format: date-time }
        deliveryStatus:
          type: string
          enum: [unconfirmed, email.sent, email.delivery_delayed, email.delivered, email.failed, email.bounced, email.complained]
        deliveryUpdatedAt: { type: [string, "null"], format: date-time }
    InboxUpdateInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [read, unread, dismiss, read-all] }
        id: { type: string, minLength: 1 }
    InboxThresholds:
      type: object
      required: [warningDays, upcomingDays]
      properties:
        warningDays: { type: integer, minimum: 1, maximum: 30 }
        upcomingDays: { type: integer, minimum: 1, maximum: 90 }
    InboxNotification:
      type: object
      required: [id, kind, severity, title, description, path, relatedId, createdAt, updatedAt, readAt, dismissedAt, resolvedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [expiry, recommendations, approvals, failures, completed] }
        severity: { type: string, enum: [critical, warning, upcoming, info, success] }
        title: { type: string }
        description: { type: string }
        path: { type: string }
        relatedId: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        readAt: { type: [string, "null"] }
        dismissedAt: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"] }
    InboxState:
      type: object
      required: [items, unreadCount, counts, thresholds, checkedAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxNotification" }
        unreadCount: { type: integer }
        checkedAt: { type: string }
        thresholds: { $ref: "#/components/schemas/InboxThresholds" }
        counts:
          type: object
          required: [critical, approaching, pendingApproval, failed]
          properties:
            critical: { type: integer }
            approaching: { type: integer }
            pendingApproval: { type: integer }
            failed: { type: integer }
    NotificationSettingsInput:
      type: object
      required: [enabled, phone, optIn, expiry, recommendations, approvals, failures, completed, reminderHours, maxReminders, dailyLimit, riskThreshold]
      properties:
        enabled: { type: boolean }
        phone: { type: string, maxLength: 20 }
        optIn: { type: boolean }
        expiry: { type: boolean }
        recommendations: { type: boolean }
        approvals: { type: boolean }
        failures: { type: boolean }
        completed: { type: boolean }
        reminderHours: { type: integer, minimum: 24, maximum: 168 }
        maxReminders: { type: integer, minimum: 0, maximum: 3 }
        dailyLimit: { type: integer, minimum: 1, maximum: 20 }
        riskThreshold: { type: number, minimum: 0, maximum: 1000000 }
    NotificationRecord:
      type: object
      required: [id, eventId, kind, priority, title, message, createdAt, status, reminderIndex, attempts, recipient, reviewUrl, expiresAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        kind: { type: string, enum: [expiry, recommendations, approvals, failures, completed] }
        priority: { type: string, enum: [critical, warning, upcoming, info] }
        title: { type: string }
        message: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [demo, queued, sending, accepted, delivered, read, failed, unknown, cancelled] }
        reminderIndex: { type: integer }
        attempts: { type: integer }
        recipient: { type: string }
        reviewUrl: { type: string }
        expiresAt: { type: string }
        resolvedAt: { type: string }
        providerMessageId: { type: string }
        deliveredAt: { type: string }
        lastError: { type: string }
    NotificationState:
      type: object
      required: [settings, records, mode, liveReady, blockers, monitor, consentAt]
      properties:
        settings: { $ref: "#/components/schemas/NotificationSettingsInput" }
        records:
          type: array
          items: { $ref: "#/components/schemas/NotificationRecord" }
        mode: { type: string, enum: [demo] }
        liveReady: { type: boolean }
        blockers:
          type: array
          items: { type: string }
        monitor: { type: string }
        lastScan: { type: string }
        consentAt: { type: ["string", "null"] }
        sandbox: { $ref: "#/components/schemas/SandboxNotificationState" }
    MonitorHeartbeatStatus:
      type: object
      required: [status, lastAttemptAt, lastSuccessfulAt]
      properties:
        status: { type: string, enum: [healthy, stale, failed, not-started] }
        lastAttemptAt: { type: ["string", "null"], format: date-time }
        lastSuccessfulAt: { type: ["string", "null"], format: date-time }
    ExpiryCheckStatus:
      type: object
      required: [status, lastCompletedAt, outcome]
      properties:
        status: { type: string, enum: [healthy, stale, failed, not-started] }
        lastCompletedAt: { type: ["string", "null"], format: date-time }
        outcome: { type: ["string", "null"], enum: [success, failed, null] }
    SandboxNotificationMessage:
      type: object
      required: [id, createdAt, status, message]
      properties:
        id: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [sending, accepted, delivered, read, failed, unknown] }
        message: { type: string }
        providerMessageId: { type: string }
