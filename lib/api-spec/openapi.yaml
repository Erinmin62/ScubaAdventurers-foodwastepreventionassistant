openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /guard/ingredients/{id}/batches:
    post:
      operationId: saveIngredientBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockBatchInput" }
      responses:
        "200":
          description: Received stock saved, planned delivery unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/notifications:
    get:
      operationId: getNotifications
      responses:
        "200":
          description: Notification preferences and demo delivery history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
    patch:
      operationId: saveNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /guard/notifications/scan:
    post:
      operationId: scanNotifications
      responses:
        "200":
          description: Scan completed without approving any action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationState" }
  /guard/notifications/tick:
    post:
      operationId: runNotificationTick
      responses:
        "204": { description: Authorized server-side planning and notification scan completed; demo previews only }
        "403": { description: Invalid scheduler credential }
        "503": { description: Scheduler credential not configured }
  /guard/notifications/review:
    post:
      operationId: reviewNotification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReviewInput" }
      responses:
        "200":
          description: Read-only review, token never approves actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationReview" }
        "410":
          description: Link expired, resolved or invalid
  /guard/notifications/webhook:
    get:
      operationId: verifyWhatsAppWebhook
      responses:
        "200": { description: Meta verification challenge }
        "403": { description: Verification rejected }
    post:
      operationId: receiveWhatsAppWebhook
      responses:
        "200": { description: Verified provider status processed }
        "403": { description: Signature verification rejected }
  /guard/reorders:
    get:
      operationId: getReorders
      responses:
        "200":
          description: Live analysis and saved simulated order proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/scan:
    post:
      operationId: scanReorders
      responses:
        "200":
          description: Proposals generated without execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/settings:
    patch:
      operationId: configureReorder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderConfig" }
      responses:
        "200":
          description: Assumptions saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/reorders/{id}/decision:
    post:
      operationId: decideReorder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDecisionInput"
      responses:
        "200":
          description: Decision and execution result, including failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderState" }
  /guard/automation:
    patch:
      operationId: updateAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationSettingsInput" }
      responses:
        "200":
          description: Automation settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/automation/run:
    post:
      operationId: runAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRunInput" }
      responses:
        "200":
          description: Enabled workflows run now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/state:
    get:
      operationId: getGuardState
      responses:
        "200":
          description: Complete cafe workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/records:
    post:
      operationId: addGuardRecords
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordsInput" }
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/recommendations/{id}/decision:
    post:
      operationId: decideRecommendation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/recommendations/{id}/follow-up:
    post:
      operationId: attachFollowUp
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowUpScheduleInput" }
      responses:
        "200":
          description: Follow-up attached using a current snapshot, not a historical baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /guard/follow-ups/{id}/outcome:
    post:
      operationId: recordFollowUpOutcome
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "200":
          description: Outcome recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardState" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    NotificationSettingsInput:
      type: object
      required: [enabled, phone, optIn, expiry, recommendations, approvals, failures, completed, reminderHours, maxReminders, dailyLimit, riskThreshold]
      properties:
        enabled: { type: boolean }
        phone: { type: string, maxLength: 20 }
        optIn: { type: boolean }
        expiry: { type: boolean }
        recommendations: { type: boolean }
        approvals: { type: boolean }
        failures: { type: boolean }
        completed: { type: boolean }
        reminderHours: { type: integer, minimum: 24, maximum: 168 }
        maxReminders: { type: integer, minimum: 0, maximum: 3 }
        dailyLimit: { type: integer, minimum: 1, maximum: 20 }
        riskThreshold: { type: number, minimum: 0, maximum: 1000000 }
    NotificationRecord:
      type: object
      required: [id, eventId, kind, priority, title, message, createdAt, status, reminderIndex, attempts, recipient, reviewUrl, expiresAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        kind: { type: string, enum: [expiry, recommendations, approvals, failures, completed] }
        priority: { type: string, enum: [critical, warning, upcoming, info] }
        title: { type: string }
        message: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [demo, queued, sending, accepted, delivered, read, failed, unknown, cancelled] }
        reminderIndex: { type: integer }
        attempts: { type: integer }
        recipient: { type: string }
        reviewUrl: { type: string }
        expiresAt: { type: string }
        resolvedAt: { type: string }
        providerMessageId: { type: string }
        deliveredAt: { type: string }
        lastError: { type: string }
    NotificationState:
      type: object
      required: [settings, records, mode, liveReady, blockers, monitor, consentAt]
      properties:
        settings: { $ref: "#/components/schemas/NotificationSettingsInput" }
        records:
          type: array
          items: { $ref: "#/components/schemas/NotificationRecord" }
        mode: { type: string, enum: [demo] }
        liveReady: { type: boolean }
        blockers:
          type: array
          items: { type: string }
        monitor: { type: string }
        lastScan: { type: string }
        consentAt: { type: ["string", "null"] }
        sandbox: { $ref: "#/components/schemas/SandboxNotificationState" }
    SandboxNotificationMessage:
      type: object
      required: [id, createdAt, status, message]
      properties:
        id: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [sending, accepted, delivered, read, failed, unknown] }
        message: { type: string }
        providerMessageId: { type: string }
        lastError: { type: string }
    SandboxNotificationState:
      type: object
      required: [configured, status, notice, dailyLimit, usedToday, messages]
      properties:
        configured: { type: boolean }
        status: { type: string, enum: [not-configured, checking, waiting-for-opt-in, ready, window-closed, paused, error, daily-limit] }
        notice: { type: string }
        checkedAt: { type: string }
        windowExpiresAt: { type: string }
        dailyLimit: { type: integer }
        usedToday: { type: integer }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SandboxNotificationMessage" }
    NotificationReviewInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 40, maxLength: 100 }
    NotificationReview:
      type: object
      required: [title, message, expiresAt, path, demo, notice]
      properties:
        title: { type: string }
        message: { type: string }
        expiresAt: { type: string }
        path: { type: string }
        demo: { type: boolean }
        notice: { type: string }
    ReorderDecisionInput:
      type: object
      required: [decision, approver]
      properties:
        decision: { type: string, enum: [approve, reject] }
        approver: { type: string, minLength: 1, maxLength: 80 }
        quantity: { type: number, minimum: 0, maximum: 1000000 }
        deliveryDate: { type: string }
    ReorderConfig:
      type: object
      required: [ingredientId, leadDays, reviewDays, minOrder, safetyStock, shelfDays]
      properties:
        ingredientId: { type: string }
        leadDays: { type: integer, minimum: 1, maximum: 14 }
        reviewDays: { type: integer, minimum: 1, maximum: 14 }
        minOrder: { type: number, minimum: 0, maximum: 1000000 }
        safetyStock: { type: number, minimum: 0, maximum: 1000000 }
        shelfDays: { type: integer, minimum: 1, maximum: 90 }
        dailyUsage: { type: number, minimum: 0, maximum: 1000000 }
    ReorderLine:
      type: object
      required: [ingredientId, name, unit, unitCost, expiry, currentStock, expiredQuantity, wasteQuantity, wasteCost, incomingQuantity, incomingDate, dailyUsage, expectedDemand, originalQuantity, recommendedQuantity, additionalQuantity, deliveryDate, originalCost, proposedCost, potentialWasteReduction, shortageBeforeDelivery, explanation, assumptions, demandAvailable, config]
      properties:
        ingredientId: { type: string }
        name: { type: string }
        unit: { type: string }
        unitCost: { type: number }
        expiry: { type: string }
        currentStock: { type: number }
        expiredQuantity: { type: number }
        wasteQuantity: { type: number }
        wasteCost: { type: number }
        incomingQuantity: { type: number }
        incomingDate: { type: string }
        dailyUsage: { type: number }
        expectedDemand: { type: number }
        originalQuantity: { type: number }
        recommendedQuantity: { type: number }
        additionalQuantity: { type: number }
        deliveryDate: { type: string }
        originalCost: { type: number }
        proposedCost: { type: number }
        potentialWasteReduction: { type: number }
        shortageBeforeDelivery: { type: number }
        explanation: { type: string }
        assumptions: { type: array, items: { type: string } }
        demandAvailable: { type: boolean }
        config: { $ref: "#/components/schemas/ReorderConfig" }
    ReorderPlan:
      type: object
      required: [id, status, createdAt, fingerprint, line, detail]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, EXECUTED, REJECTED, FAILED, SUPERSEDED] }
        createdAt: { type: string }
        fingerprint: { type: string }
        line: { $ref: "#/components/schemas/ReorderLine" }
        detail: { type: string }
        decidedAt: { type: string }
        approver: { type: string }
        approvedQuantity: { type: number }
        approvedDate: { type: string }
        beforeQuantity: { type: number }
        afterQuantity: { type: number }
        beforeDate: { type: string }
        afterDate: { type: string }
    ReorderState:
      type: object
      required: [settings, plans, analysis]
      properties:
        settings: { type: array, items: { $ref: "#/components/schemas/ReorderConfig" } }
        plans: { type: array, items: { $ref: "#/components/schemas/ReorderPlan" } }
        analysis: { type: array, items: { $ref: "#/components/schemas/ReorderLine" } }
        lastScan: { type: string }
    AutomationSettingsInput:
      type: object
      additionalProperties: false
      properties:
        dailyPlanning: { type: boolean }
        followUpHandling: { type: boolean }
    AutomationRunInput:
      type: object
      required: [workflow]
      properties:
        workflow: { type: string, enum: [daily-planning, follow-ups, all] }
    AutomationRun:
      type: object
      required: [id, workflow, trigger, time, date, detail, draftCount, riskCount, dueCount, overdueCount, predictedPortions]
      properties:
        id: { type: string }
        workflow: { type: string, enum: [daily-planning, follow-ups] }
        trigger: { type: string, enum: [automatic, manual] }
        time: { type: string }
        date: { type: string }
        detail: { type: string }
        draftCount: { type: integer }
        riskCount: { type: integer }
        dueCount: { type: integer }
        overdueCount: { type: integer }
        predictedPortions: { type: integer }
    AutomationState:
      type: object
      required: [dailyPlanning, followUpHandling, runs]
      properties:
        dailyPlanning: { type: boolean }
        followUpHandling: { type: boolean }
        runs:
          type: array
          items: { $ref: "#/components/schemas/AutomationRun" }
    StockBatchInput:
      type: object
      required: [quantity, expiry, receivedDate]
      properties:
        id: { type: string }
        quantity: { type: number, minimum: 0, maximum: 1000000 }
        expiry: { type: string }
        receivedDate: { type: ["string", "null"] }
    StockBatch:
      type: object
      required: [id, quantity, expiry, receivedDate]
      properties:
        id: { type: string }
        quantity: { type: number, minimum: 0 }
        expiry: { type: string }
        receivedDate: { type: ["string", "null"] }
    Ingredient:
      type: object
      required: [id, name, quantity, unit, expiry, cost, category, deliveryQuantity, deliveryDate]
      properties:
        id: { type: string }
        name: { type: string }
        quantity: { type: number, minimum: 0 }
        unit: { type: string }
        expiry: { type: string }
        cost: { type: number, minimum: 0 }
        category: { type: string }
        deliveryQuantity: { type: number, minimum: 0 }
        deliveryDate: { type: string }
        measuredDate: { type: ["string", "null"] }
        batches:
          type: array
          items: { $ref: "#/components/schemas/StockBatch" }
    Sale:
      type: object
      required: [date, menuId, portions]
      properties:
        date: { type: string }
        menuId: { type: string }
        portions: { type: integer, minimum: 0 }
    Result:
      type: object
      required: [date, menuId, prepared, sold, leftover]
      properties:
        date: { type: string }
        menuId: { type: string }
        prepared: { type: integer, minimum: 0 }
        sold: { type: integer, minimum: 0 }
        leftover: { type: integer, minimum: 0 }
    RecipeItem:
      type: object
      required: [ingredientId, amount]
      properties:
        ingredientId: { type: string }
        amount: { type: number }
    MenuItem:
      type: object
      required: [id, name, price, cost, recipe]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        cost: { type: number }
        recipe:
          type: array
          items: { $ref: "#/components/schemas/RecipeItem" }
    Forecast:
      type: object
      required: [menuId, name, predicted, capacity, suggested, confidence, reason]
      properties:
        menuId: { type: string }
        name: { type: string }
        predicted: { type: integer }
        capacity: { type: integer }
        suggested: { type: integer }
        confidence: { type: string }
        reason: { type: string }
    Risk:
      type: object
      required: [ingredientId, name, daysLeft, level, expectedUse, atRisk, value, message]
      properties:
        ingredientId: { type: string }
        name: { type: string }
        daysLeft: { type: integer }
        level: { type: string }
        expectedUse: { type: number }
        atRisk: { type: number }
        value: { type: number }
        message: { type: string }
    Recommendation:
      type: object
      required: [id, type, targetId, title, description, original, suggested, unit, savings, status, approvedQuantity]
      properties:
        id: { type: string }
        type: { type: string }
        targetId: { type: string }
        title: { type: string }
        description: { type: string }
        original: { type: number }
        suggested: { type: number }
        unit: { type: string }
        savings: { type: number }
        status: { type: string }
        approvedQuantity: { type: ["number", "null"] }
    Activity:
      type: object
      required: [id, time, title, detail, decision, impact]
      properties:
        id: { type: string }
        time: { type: string }
        title: { type: string }
        detail: { type: string }
        decision: { type: string }
        impact: { type: number }
    Summary:
      type: object
      required: [predictedPortions, riskValue, pendingCount, estimatedSavings, baselineWasteCost, actualWasteCost, baselinePurchaseCost, plannedPurchaseCost, baselineWasteKg, actualWasteKg]
      properties:
        predictedPortions: { type: integer }
        riskValue: { type: number }
        pendingCount: { type: integer }
        estimatedSavings: { type: number }
        baselineWasteCost: { type: number }
        actualWasteCost: { type: number }
        baselinePurchaseCost: { type: number }
        plannedPurchaseCost: { type: number }
        baselineWasteKg: { type: number }
        actualWasteKg: { type: number }
    GuardState:
      type: object
      required: [today, tomorrow, cafeName, synthetic, ingredients, sales, results, menu, forecasts, risks, recommendations, activity, summary, followUps, approvedRecommendations, automation]
      properties:
        today: { type: string }
        tomorrow: { type: string }
        cafeName: { type: string }
        synthetic: { type: boolean }
        automation: { $ref: "#/components/schemas/AutomationState" }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        sales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        results:
          type: array
          items: { $ref: "#/components/schemas/Result" }
        menu:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
        forecasts:
          type: array
          items: { $ref: "#/components/schemas/Forecast" }
        risks:
          type: array
          items: { $ref: "#/components/schemas/Risk" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        summary: { $ref: "#/components/schemas/Summary" }
        followUps:
          type: array
          items: { $ref: "#/components/schemas/FollowUp" }
        approvedRecommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    FollowUpScheduleInput:
      type: object
      properties:
        followUpDays: { type: integer, enum: [1, 2], default: 2 }
    FollowUpIngredient:
      type: object
      required: [ingredientId, name, unit, startingQuantity, expiry, deliveryQuantity, deliveryDate, expectedUsage, expectedRemaining]
      properties:
        batches:
          type: array
          items: { $ref: "#/components/schemas/StockBatch" }
        ingredientId: { type: string }
        name: { type: string }
        unit: { type: string }
        startingQuantity: { type: number }
        expiry: { type: string }
        deliveryQuantity: { type: number }
        deliveryDate: { type: string }
        expectedUsage: { type: number }
        expectedRemaining: { type: number }
    OutcomeRowInput:
      type: object
      required: [ingredientId, remaining, wasted]
      properties:
        ingredientId: { type: string }
        remaining: { type: number, minimum: 0, maximum: 1000000 }
        wasted: { type: number, minimum: 0, maximum: 1000000 }
    OutcomeInput:
      type: object
      required: [observationDate, actionTaken, rows, updateInventory]
      properties:
        observationDate: { type: string }
        actionTaken: { type: string, minLength: 1, maxLength: 1000 }
        updateInventory: { type: boolean }
        rows:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OutcomeRowInput" }
    OutcomeRow:
      allOf:
        - $ref: "#/components/schemas/OutcomeRowInput"
        - type: object
          required: [assessment, nextAction, inventoryUpdate]
          properties:
            assessment: { type: string }
            nextAction: { type: string }
            inventoryUpdate: { type: string }
    FollowUpOutcome:
      type: object
      required: [observationDate, actionTaken, rows, recordedAt]
      properties:
        observationDate: { type: string }
        actionTaken: { type: string }
        recordedAt: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/OutcomeRow" }
    FollowUp:
      type: object
      required: [id, recommendationId, recommendation, approvedAction, approvedQuantity, approvedAt, snapshotAt, startingDate, scheduledDate, name, status, ingredients, outcome, cancellationReason]
      properties:
        id: { type: string }
        recommendationId: { type: string }
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        approvedAction: { type: string }
        approvedQuantity: { type: number }
        approvedAt: { type: ["string", "null"] }
        snapshotAt: { type: string }
        startingDate: { type: string }
        scheduledDate: { type: string }
        name: { type: string }
        status: { type: string, enum: [outstanding, completed, cancelled] }
        cancellationReason: { type: ["string", "null"] }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/FollowUpIngredient" }
        outcome:
          oneOf:
            - $ref: "#/components/schemas/FollowUpOutcome"
            - type: "null"
    RecordsInput:
      type: object
      required: [kind, rows]
      properties:
        kind: { type: string, enum: [sales, inventory, results] }
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            additionalProperties: true
    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, edited, rejected] }
        quantity: { type: number, minimum: 0 }
        note: { type: string, maxLength: 500 }
        followUpDays: { type: integer, enum: [1, 2], default: 2 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
